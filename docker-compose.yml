version: '3.4'

services:
  testserver:
    image: ${DOCKER_REGISTRY-}hsegrafanastreamingtestserver
    build:
      context: .
      dockerfile: test-server/HSE.Grafana.Streaming.TestServer/Dockerfile
    ports:
      - 8181:80
    # Each connected dashboard/user holds one long-lived WebSocket = one open
    # file descriptor. Raise the default Docker limit (1024) so it doesn't
    # silently cap how many people can be connected at once.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
  grafana:
    image: hse-streaming-grafana
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 3000:3000
    volumes:
     - grafana:/var/lib/grafana
volumes:
  grafana: